[project]
name = "steward"
version = "0.1.0"
description = "An agent that spends someone else's money well — delegated spending with a privacy boundary"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "mcp>=2.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The only way past the no-network guard in tests/conftest.py. Grep for it to
# list every test that can reach the network; each is also skipped unless its
# own environment variable is set.
markers = ["live: reaches the real network; opt-in, never in a default run"]
